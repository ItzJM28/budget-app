<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123a30">
<meta name="description" content="PeraFlow: track your accounts, spending, budgets, bills and savings goals in pesos.">
<title>PeraFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f7a5c'/%3E%3Cpath d='M11 25V8h7a5 5 0 0 1 0 10h-7M8 13h12M8 16.5h9' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
  // Set the theme before the page paints, so dark mode never flashes white.
  (function () {
    var t = "system";
    try { t = localStorage.getItem("pf-theme") || "system"; } catch (e) {}
    var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
</head>
<body>
<div id="root"></div>
<noscript>PeraFlow needs JavaScript turned on.</noscript>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
<script>
// Babel ignores the TypeScript preset unless it's told the files are .tsx. Keep this, or the page goes blank.
Babel.registerPreset("tsx", { presets: [[Babel.availablePresets.typescript, { allExtensions: true, isTSX: true }]] });
</script>
<!-- Money and date math (plain JS, also used by tests/money.test.js) -->
<script src="src/money.js"></script>
<!-- The app. Babel compiles these in order; they share one global scope. -->
<script type="text/babel" data-presets="tsx,react" src="src/ui.tsx"></script>
<script type="text/babel" data-presets="tsx,react" src="src/data.tsx"></script>
<script type="text/babel" data-presets="tsx,react" src="src/forms.tsx"></script>
<script type="text/babel" data-presets="tsx,react" src="src/pages.tsx"></script>
<script type="text/babel" data-presets="tsx,react" src="src/app.tsx"></script>
</body>
</html>
