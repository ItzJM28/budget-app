<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d3e">
<title>Penny Budget</title>
<style>
:root{--bg:#f4f6f5;--surface:#fff;--ink:#14201f;--muted:#4f625f;--line:#d9e1df;--accent:#0f6b63;--accent-ink:#fff;--bad:#b3261e;--good:#1b7a43;--r:10px}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
::selection{background:#bfe3dd}
::placeholder{color:#7b8c89}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:1.1rem;margin-bottom:12px}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation;user-select:none;cursor:pointer;min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);transition:transform .12s cubic-bezier(.23,1,.32,1),background-color .15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.55;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
@media (hover:hover) and (pointer:fine){button:hover:not(:disabled){background:#eaf1ef}button.primary:hover:not(:disabled){background:#0c5a54}}
:focus-visible{outline:3px solid #2b9d92;outline-offset:2px}
input,select{width:100%;min-height:44px;padding:0 12px;border:1px solid #9fb0ad;border-radius:var(--r);background:#fff}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:14px;min-width:0}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
header.top{background:#0f3d3e;color:#e6f2f0;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
header.top .in{max-width:980px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top span.email{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#b9d6d2;font-size:.9rem}
header.top button{background:transparent;color:#e6f2f0;border-color:#5b8783;flex-shrink:0}
.auth{min-height:100dvh;display:grid;place-items:center;padding:16px}
.auth .card{width:100%;max-width:400px}
.tabs{display:flex;gap:8px;margin:16px 0}
.tabs button{flex:1}
.tabs button[aria-pressed=true]{background:#e1efec;border-color:var(--accent);font-weight:600}
.divider{text-align:center;color:var(--muted);margin:14px 0;font-size:.9rem}
.err{background:#fbe9e7;color:#8c1d18;padding:10px 12px;border-radius:var(--r);margin-bottom:14px;font-size:.92rem;overflow-wrap:anywhere}
.ok{background:#e3f3ea;color:#14572f;padding:10px 12px;border-radius:var(--r);margin-bottom:14px;font-size:.92rem}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(3,1fr);margin:16px 0}
.stat{min-width:0}
.stat .v{font-size:1.6rem;font-weight:650;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .l{color:var(--muted);font-size:.92rem}
.cols{display:grid;gap:16px;grid-template-columns:1fr 1.4fr;align-items:start}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{height:8px;background:#e6ecea;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transform-origin:left;transition:transform .25s cubic-bezier(.23,1,.32,1)}
.cat{margin-bottom:12px}
.cat .h{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.cat .h span:first-child{min-width:0;overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
ul.list{list-style:none;margin:0;padding:0;max-height:480px;overflow:auto;overscroll-behavior:contain}
ul.list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
ul.list .m{flex:1;min-width:0}
ul.list .m b{display:block;font-weight:600;overflow-wrap:anywhere}
ul.list .m small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inc{color:var(--good)}.exp{color:var(--bad)}
button.icon{min-width:44px;padding:0;flex-shrink:0;display:grid;place-items:center;border-color:transparent;background:transparent}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.mon{display:flex;gap:8px;align-items:center;justify-content:space-between}
.mon input{max-width:200px}
@media (max-width:760px){.grid{grid-template-columns:1fr}.cols{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
<script type="text/babel" data-presets="typescript,react">
const SUPABASE_URL: string = "https://hxthblueuasuqlxqkwsk.supabase.co";
const SUPABASE_KEY: string = "sb_publishable_sRNP98itHiC_w7o_90iZtw_7NJjYp16";

const { useState, useEffect, useMemo, useCallback, useRef } = React;
type Kind = "income" | "expense";
interface Tx { id: string; kind: Kind; category: string; note: string | null; amount: number; happened_on: string; }

const configured = SUPABASE_URL.startsWith("http") && SUPABASE_KEY.length > 20;
const sb: any = configured ? (window as any).supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const money = (n: number) => new Intl.NumberFormat(undefined, { style: "currency", currency: "USD" }).format(Number.isFinite(n) ? n : 0);
const CATS = ["Groceries", "Rent", "Transport", "Bills", "Eating out", "Health", "Fun", "Salary", "Other"];

// Local calendar date (not UTC), so late-evening entries land on the right day and month.
const pad = (n: number) => String(n).padStart(2, "0");
const today = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
// "2026-12" -> { start: "2026-12-01", end: "2027-01-01" } (end is exclusive)
function monthRange(month: string) {
  const [y, m] = month.split("-").map(Number);
  const ny = m === 12 ? y + 1 : y;
  const nm = m === 12 ? 1 : m + 1;
  return { start: y + "-" + pad(m) + "-01", end: ny + "-" + pad(nm) + "-01" };
}
// Accepts "12", "12.5", "1,234.56", " 1 234.56 ". Returns NaN for anything else.
function parseAmount(raw: string): number {
  const s = raw.trim().replace(/[,\s]/g, "");
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
  return Number(s);
}

function GoogleIcon() {
  return (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true">
      <path d="M21 12.2c0-.6-.1-1.200-.2-1.700H12v3.300h5.100a4.400 4.400 0 0 1-1.900 2.900" />
      <path d="M12 21a9 9 0 0 0 6.200-2.300M5.800 14.300A5.500 5.500 0 0 1 5.500 12c0-.8.100-1.600.3-2.300M7.200 5.800A9 9 0 0 1 12 3c2.400 0 4.400.9 5.900 2.300" />
    </svg>
  );
}

function Auth() {
  const [mode, setMode] = useState<"in" | "up">("in");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [info, setInfo] = useState("");

  async function submit(e: any) {
    e.preventDefault(); setErr(""); setInfo("");
    if (pw.length < 6) { setErr("Password needs at least 6 characters."); return; }
    setBusy(true);
    const res = mode === "in"
      ? await sb.auth.signInWithPassword({ email, password: pw })
      : await sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: window.location.origin } });
    setBusy(false);
    if (res.error) setErr(res.error.message);
    else if (mode === "up" && !res.data.session) setInfo("Account created. Check your email for a confirmation link, then log in.");
  }
  async function google() {
    setErr("");
    const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: window.location.origin } });
    if (error) setErr(error.message + " Make sure Google is switched on in Supabase under Authentication > Providers.");
  }
  return (
    <div className="auth">
      <div className="card">
        <h1>Penny Budget</h1>
        <p style={{ color: "var(--muted)", margin: "4px 0 0" }}>Track what comes in and what goes out.</p>
        <div className="tabs" role="group" aria-label="Log in or register">
          <button type="button" aria-pressed={mode === "in"} onClick={() => setMode("in")}>Log in</button>
          <button type="button" aria-pressed={mode === "up"} onClick={() => setMode("up")}>Register</button>
        </div>
        <button type="button" className="gbtn" onClick={google}><GoogleIcon /> Continue with Google</button>
        <div className="divider">or use email</div>
        {err && <div className="err" role="alert">{err}</div>}
        {info && <div className="ok" role="status">{info}</div>}
        <form onSubmit={submit}>
          <div className="field"><label htmlFor="em">Email</label>
            <input id="em" type="email" autoComplete="email" required value={email} onChange={(e: any) => setEmail(e.target.value)} placeholder="you@example.com" /></div>
          <div className="field"><label htmlFor="pw">Password</label>
            <input id="pw" type="password" autoComplete={mode === "in" ? "current-password" : "new-password"} required value={pw} onChange={(e: any) => setPw(e.target.value)} placeholder="At least 6 characters" /></div>
          <button className="primary" style={{ width: "100%" }} disabled={busy}>
            {busy ? "Please wait…" : mode === "in" ? "Log in" : "Create account"}
          </button>
        </form>
      </div>
    </div>
  );
}

function Dashboard({ user }: { user: any }) {
  const [items, setItems] = useState<Tx[]>([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");
  const [month, setMonth] = useState(today().slice(0, 7));
  const [kind, setKind] = useState<Kind>("expense");
  const [amount, setAmount] = useState("");
  const [cat, setCat] = useState("Groceries");
  const [note, setNote] = useState("");
  const [date, setDate] = useState(today());
  const [saving, setSaving] = useState(false);
  const reqId = useRef(0);

  // The database does the month filtering: happened_on >= first day of month and < first day of next month.
  const load = useCallback(async () => {
    const id = ++reqId.current;
    const { start, end } = monthRange(month);
    setLoading(true); setErr(""); setItems([]);
    const { data, error } = await sb.from("transactions")
      .select("id,kind,category,note,amount,happened_on")
      .gte("happened_on", start).lt("happened_on", end)
      .order("happened_on", { ascending: false }).order("created_at", { ascending: false })
      .limit(1000);
    if (id !== reqId.current) return; // a newer month was picked while this one was loading
    if (error) { setItems([]); setErr("Couldn't load this month's transactions: " + error.message + ". Check your connection and try again."); }
    else setItems((data as any[]).map((d) => ({ ...d, amount: Number(d.amount) })));
    setLoading(false);
  }, [month]);
  useEffect(() => { load(); }, [load]);

  const shown = items;
  const income = useMemo(() => shown.filter((t) => t.kind === "income").reduce((s, t) => s + t.amount, 0), [shown]);
  const spent = useMemo(() => shown.filter((t) => t.kind === "expense").reduce((s, t) => s + t.amount, 0), [shown]);
  const byCat = useMemo(() => {
    const m: Record<string, number> = {};
    shown.filter((t) => t.kind === "expense").forEach((t) => { m[t.category] = (m[t.category] || 0) + t.amount; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  }, [shown]);

  async function add(e: any) {
    e.preventDefault(); setErr("");
    const amt = parseAmount(amount);
    if (!(amt > 0)) { setErr("Enter an amount greater than zero, like 12.50 or 1,234.56 (up to 2 decimals)."); return; }
    if (!date) { setErr("Pick a date for this transaction."); return; }
    setSaving(true);
    const { error } = await sb.from("transactions").insert({ kind, category: cat, note: note.trim() || null, amount: amt, happened_on: date });
    setSaving(false);
    if (error) { setErr("Couldn't save: " + error.message); return; }
    setAmount(""); setNote("");
    // Jump to the saved date's month so the new row is visible; reload if already there.
    if (date.slice(0, 7) !== month) setMonth(date.slice(0, 7)); else load();
  }
  async function remove(id: string) {
    const { error } = await sb.from("transactions").delete().eq("id", id);
    if (error) setErr("Couldn't delete: " + error.message); else setItems((x) => x.filter((t) => t.id !== id));
  }

  return (
    <>
      <header className="top"><div className="in">
        <strong>Penny Budget</strong>
        <span className="email" title={user.email}>{user.email}</span>
        <button onClick={() => sb.auth.signOut()}>Log out</button>
      </div></header>
      <main className="wrap">
        <div className="mon">
          <h2 style={{ margin: 0 }}>Dashboard</h2>
          <div><label htmlFor="mo" style={{ position: "absolute", left: -9999 }}>Month</label>
            <input id="mo" type="month" value={month} onChange={(e: any) => e.target.value && setMonth(e.target.value)} /></div>
        </div>
        {err && <div className="err" role="alert" style={{ marginTop: 12 }}>{err}</div>}
        <div className="grid">
          <div className="card stat"><div className="l">Income</div><div className="v inc">{money(income)}</div></div>
          <div className="card stat"><div className="l">Spent</div><div className="v exp">{money(spent)}</div></div>
          <div className="card stat"><div className="l">Left this month</div><div className="v" style={{ color: income - spent < 0 ? "var(--bad)" : "inherit" }}>{money(income - spent)}</div></div>
        </div>
        <div className="cols">
          <div style={{ display: "grid", gap: 16 }}>
            <form className="card" onSubmit={add}>
              <h2>Add a transaction</h2>
              <div className="tabs" style={{ marginTop: 0 }} role="group" aria-label="Type">
                <button type="button" aria-pressed={kind === "expense"} onClick={() => setKind("expense")}>Expense</button>
                <button type="button" aria-pressed={kind === "income"} onClick={() => setKind("income")}>Income</button>
              </div>
              <div className="row2">
                <div className="field"><label htmlFor="am">Amount</label>
                  <input id="am" inputMode="decimal" enterKeyHint="next" value={amount} onChange={(e: any) => setAmount(e.target.value)} placeholder="0.00" /></div>
                <div className="field"><label htmlFor="dt">Date</label>
                  <input id="dt" type="date" value={date} onChange={(e: any) => setDate(e.target.value)} required /></div>
              </div>
              <div className="field"><label htmlFor="ct">Category</label>
                <select id="ct" value={cat} onChange={(e: any) => setCat(e.target.value)}>{CATS.map((c) => <option key={c}>{c}</option>)}</select></div>
              <div className="field"><label htmlFor="nt">Note (optional)</label>
                <input id="nt" enterKeyHint="done" maxLength={120} value={note} onChange={(e: any) => setNote(e.target.value)} placeholder="e.g. Weekly shop" /></div>
              <button className="primary" style={{ width: "100%" }} disabled={saving}>{saving ? "Saving…" : "Save transaction"}</button>
            </form>
            <div className="card">
              <h2>Spending by category</h2>
              {byCat.length === 0 ? <div className="empty">No expenses this month yet. Add one to see where your money goes.</div> :
                byCat.map(([c, v]) => (
                  <div className="cat" key={c}>
                    <div className="h"><span>{c}</span><span className="num">{money(v)}</span></div>
                    <div className="bar"><i style={{ transform: `scaleX(${spent ? v / spent : 0})`, width: "100%" }} /></div>
                  </div>))}
            </div>
          </div>
          <div className="card">
            <h2>{shown.length} {shown.length === 1 ? "transaction" : "transactions"}</h2>
            {loading ? <div className="empty">Loading…</div> : shown.length === 0 ?
              <div className="empty">Nothing here for this month. Use the form to add your first income or expense.</div> :
              <ul className="list">
                {shown.map((t) => (
                  <li key={t.id}>
                    <div className="m"><b>{t.category}</b><small title={t.note || ""}>{t.happened_on}{t.note ? " · " + t.note : ""}</small></div>
                    <span className={"num " + (t.kind === "income" ? "inc" : "exp")}>{t.kind === "income" ? "+" : "−"}{money(t.amount)}</span>
                    <button className="icon" aria-label={"Delete " + t.category + " transaction"} onClick={() => remove(t.id)}>
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5" /></svg>
                    </button>
                  </li>))}
              </ul>}
          </div>
        </div>
      </main>
    </>
  );
}

function App() {
  const [session, setSession] = useState<any>(null);
  const [ready, setReady] = useState(false);
  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }: any) => { setSession(data.session); setReady(true); });
    const { data } = sb.auth.onAuthStateChange((_e: any, s: any) => setSession(s));
    return () => data.subscription.unsubscribe();
  }, []);
  if (!configured) return (
    <div className="auth"><div className="card">
      <h1>One setup step left</h1>
      <p>Paste your Supabase URL and publishable key into the two <code>SUPABASE_</code> lines at the top of this file, then reload.</p>
    </div></div>);
  if (!ready) return <div className="auth"><div className="empty">Loading…</div></div>;
  return session ? <Dashboard user={session.user} /> : <Auth />;
}
ReactDOM.createRoot(document.getElementById("root")!).render(<App />);
</script>
</body>
</html>
